name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # 매일 오전 9시(UTC) 체크

env:
  VERSION_BASE: "1.0"  # 큰 변경 때 직접 올리세요 (예: 1.1). 뒤의 번호는 빌드마다 자동 증가

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # 워크플로 활성화 API 호출용 (60일 비활동 비활성화 방지)
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.ver.outputs.version }}
      ytdlp_version: ${{ steps.check.outputs.ytdlp_version }}

    steps:
      - name: 예약 워크플로 비활성화 방지 (60일 타이머 초기화)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/build.yml/enable"

      - name: 앱 버전 번호 생성 (기준값.빌드번호)
        id: ver
        run: echo "version=${VERSION_BASE}.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: yt-dlp 최신 버전 확인
        id: check
        run: |
          # PyPI에서 yt-dlp 최신 버전 가져오기
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          echo "최신 yt-dlp 버전: $LATEST"

          # 현재 Release 태그에서 yt-dlp 버전 가져오기
          CURRENT=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('body',''))" \
            | grep "yt-dlp:" | awk '{print $2}' || echo "none")
          echo "현재 빌드의 yt-dlp 버전: $CURRENT"

          if [ "$LATEST" != "$CURRENT" ]; then
            echo "새 버전 감지! 빌드 시작"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "최신 버전 유지 중. 빌드 생략"
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi
          echo "ytdlp_version=$LATEST" >> $GITHUB_OUTPUT

  build-windows:
    needs: check-and-build
    if: |
      needs.check-and-build.outputs.should_build == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    outputs:
      ytdlp_version: ${{ steps.ytdlp_ver.outputs.version }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp yt-dlp-ejs imageio-ffmpeg certifi pyinstaller

      - name: yt-dlp 실제 설치 버전 확인
        id: ytdlp_ver
        shell: bash
        run: |
          VER=$(python -c "import yt_dlp; print(yt_dlp.version.__version__)")
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: 소스에 버전 주입
        shell: python
        run: |
          with open('yt_downloader.py', 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace(
              'APP_VERSION = "1.0.0"',
              'APP_VERSION = "${{ needs.check-and-build.outputs.version }}"'
          )
          with open('yt_downloader.py', 'w', encoding='utf-8') as f:
              f.write(content)

      - name: QuickJS(유튜브 주소 해독용 JS 런타임) 받기
        shell: bash
        run: |
          mkdir -p bin
          curl -fsSL -o bin/qjs.exe \
            https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/qjs-windows-x86_64.exe

      - name: EXE 빌드
        run: |
          python -m PyInstaller `
            --onefile `
            --windowed `
            --name "YoutubeDownloader" `
            --collect-all yt_dlp `
            --collect-all yt_dlp_ejs `
            --collect-all imageio_ffmpeg `
            --add-binary "bin/qjs.exe;." `
            yt_downloader.py

      - name: 빌드 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/YoutubeDownloader.exe
          if-no-files-found: error

  build-mac:
    needs: check-and-build
    if: |
      needs.check-and-build.outputs.should_build == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp yt-dlp-ejs imageio-ffmpeg certifi pyinstaller

      - name: 소스에 버전 주입
        run: |
          python - <<'EOF'
          with open('yt_downloader.py', 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace(
              'APP_VERSION = "1.0.0"',
              'APP_VERSION = "${{ needs.check-and-build.outputs.version }}"'
          )
          with open('yt_downloader.py', 'w', encoding='utf-8') as f:
              f.write(content)
          EOF

      - name: QuickJS(유튜브 주소 해독용 JS 런타임) 받기
        run: |
          mkdir -p bin
          curl -fsSL -o bin/qjs \
            https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/qjs-darwin-arm64
          chmod +x bin/qjs

      - name: 앱 빌드
        run: |
          python -m PyInstaller \
            --windowed \
            --name "YoutubeDownloader" \
            --osx-bundle-identifier com.jcha0607.youtubedownloader \
            --collect-all yt_dlp \
            --collect-all yt_dlp_ejs \
            --collect-all imageio_ffmpeg \
            --add-binary "bin/qjs:." \
            yt_downloader.py
          # 개발자 인증서가 없으므로 ad-hoc 서명 (Apple Silicon에서 실행에 필요)
          codesign --force --deep --sign - dist/YoutubeDownloader.app

      - name: dmg 만들기
        run: |
          mkdir dmgroot
          cp -R dist/YoutubeDownloader.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "YoutubeDownloader" \
            -srcfolder dmgroot -ov -format UDZO YoutubeDownloader.dmg

      - name: 빌드 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: YoutubeDownloader.dmg
          if-no-files-found: error

  release:
    needs: [check-and-build, build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 빌드 결과 받기
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: GitHub Release 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-and-build.outputs.version }}
          name: "유튜브 다운로더 v${{ needs.check-and-build.outputs.version }}"
          body: |
            ## 다운로드
            - **Windows**: `YoutubeDownloader.exe`
            - **Mac (Apple Silicon)**: `YoutubeDownloader.dmg` 를 열어 앱을 Applications 폴더로 끌어다 놓으세요.

            ### Mac 처음 실행 시
            개발자 인증서로 서명된 앱이 아니라서 처음 한 번은 "열 수 없음" 경고가 뜹니다.
            앱을 **우클릭 → 열기**를 하거나, 시스템 설정 → 개인정보 보호 및 보안에서 **그래도 열기**를 누르세요.
            이후 업데이트는 앱 안의 "지금 업데이트" 버튼으로 자동 교체되어 이 과정이 필요 없습니다.

            ## 버전 정보
            - yt-dlp: ${{ needs.build-windows.outputs.ytdlp_version }}
          files: |
            out/YoutubeDownloader.exe
            out/YoutubeDownloader.dmg
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
