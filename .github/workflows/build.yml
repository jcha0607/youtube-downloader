name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp imageio-ffmpeg pyinstaller

      - name: 버전 번호 생성 (날짜 기반)
        id: version
        shell: bash
        run: echo "version=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: 소스에 버전 주입
        shell: python
        run: |
          with open('yt_downloader.py', 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace(
              'APP_VERSION = "1.0.0"',
              'APP_VERSION = "${{ steps.version.outputs.version }}"'
          )
          with open('yt_downloader.py', 'w', encoding='utf-8') as f:
              f.write(content)

      - name: EXE 빌드
        run: |
          python -m PyInstaller `
            --onefile `
            --windowed `
            --name "YoutubeDownloader" `
            --collect-all yt_dlp `
            --collect-all imageio_ffmpeg `
            yt_downloader.py

      - name: GitHub Release 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "유튜브 다운로더 v${{ steps.version.outputs.version }}"
          body: |
            ## 다운로드
            아래 `YoutubeDownloader.exe` 파일을 클릭해서 받으세요.

            ## 변경 사항
            - yt-dlp 최신 버전 적용
          files: dist/YoutubeDownloader.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
